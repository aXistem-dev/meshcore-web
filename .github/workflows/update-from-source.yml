name: Update from source

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: meshcore-web-update-from-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    outputs:
      updated: ${{ steps.update.outputs.updated }}
      version: ${{ steps.update.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          # Identity must match the host so commits look local to that forge.
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          else
            git config user.name "forgejo-actions[bot]"
            git config user.email "forgejo-actions[bot]@users.noreply.${{ github.repository_owner }}.local"
          fi

      - name: Check for new upstream version and update
        id: update
        run: |
          chmod +x ./update-from-source-and-push.sh
          ./update-from-source-and-push.sh

      - name: Trigger Docker image build
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Token pushes do not fire push-triggered workflows. Dispatch explicitly.
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            gh workflow run "Build and Publish Docker Image" \
              --repo "${GITHUB_REPOSITORY}" --ref main
          else
            # Forgejo / Gitea Actions dispatch (same shape as the GitHub API).
            curl -fsS -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/docker-publish.yml/dispatches" \
              -d '{"ref":"main"}'
          fi

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.update.outputs.updated }}" = "true" ]; then
            echo "### Updated to ${{ steps.update.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Pushed to \`main\` and \`${{ steps.update.outputs.version }}\`. Triggered **Build and Publish Docker Image**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No update needed" >> "$GITHUB_STEP_SUMMARY"
            echo "Latest upstream version is already in this repository (${{ steps.update.outputs.version }})." >> "$GITHUB_STEP_SUMMARY"
          fi
