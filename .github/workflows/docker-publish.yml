name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    # Backup trigger when update workflow pushes with the job token (no push event)
    workflows: ["Update from source"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Detect registry
        id: reg
        run: |
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            echo "registry=ghcr.io" >> "$GITHUB_OUTPUT"
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "image=${OWNER}/meshcore-web" >> "$GITHUB_OUTPUT"
            echo "host=github" >> "$GITHUB_OUTPUT"
          else
            # Forgejo container registry lives on the forge host itself.
            HOST="${{ github.server_url }}"
            HOST="${HOST#https://}"
            HOST="${HOST#http://}"
            echo "registry=${HOST}" >> "$GITHUB_OUTPUT"
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "image=${OWNER}/meshcore-web" >> "$GITHUB_OUTPUT"
            echo "host=forgejo" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from README and check if newer
        id: version_check
        env:
          REGISTRY: ${{ steps.reg.outputs.registry }}
          IMAGE: ${{ steps.reg.outputs.image }}
          HOST_KIND: ${{ steps.reg.outputs.host }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oE 'Current version: \[?\*\*v[0-9]+\.[0-9]+\.[0-9]+\*\*\]?' README.md 2>/dev/null | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")

          if [ -z "$VERSION" ]; then
              echo "No version found in README.md"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          echo "Current version in README: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          VERSION_NUM=${VERSION#v}
          LATEST_EXISTING=""

          if [ "$HOST_KIND" = "github" ]; then
            OWNER="${{ github.repository_owner }}"
            EXISTING_TAGS=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
              "https://api.github.com/users/${OWNER}/packages/container/meshcore-web/versions" 2>/dev/null | \
              grep -oE '"name":"v[0-9]+\.[0-9]+\.[0-9]+"' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || echo "")
          else
            # Forgejo packages API (container)
            EXISTING_TAGS=$(curl -s -H "Authorization: token ${TOKEN}" \
              "${{ github.api_url }}/packages/${{ github.repository_owner }}/container/meshcore-web/versions" 2>/dev/null | \
              grep -oE '"name":"v[0-9]+\.[0-9]+\.[0-9]+"' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || echo "")
            # Fallback: try owner-scoped packages list if versions endpoint shape differs
            if [ -z "$EXISTING_TAGS" ]; then
              EXISTING_TAGS=$(curl -s -H "Authorization: token ${TOKEN}" \
                "${{ github.api_url }}/users/${{ github.repository_owner }}/packages?type=container" 2>/dev/null | \
                grep -oE 'meshcore-web' >/dev/null && echo "" || echo "")
            fi
          fi

          if [ -z "$EXISTING_TAGS" ]; then
              echo "No existing tags found - this will be the first build"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
              for tag in $EXISTING_TAGS; do
                  TAG_NUM=${tag#v}
                  if [ -z "$LATEST_EXISTING" ] || [ "$(printf '%s\n' "$TAG_NUM" "$LATEST_EXISTING" | sort -V | tail -1)" = "$TAG_NUM" ]; then
                      LATEST_EXISTING=$TAG_NUM
                  fi
              done

              echo "Latest existing version: v${LATEST_EXISTING}"

              if [ "$(printf '%s\n' "$VERSION_NUM" "$LATEST_EXISTING" | sort -V | tail -1)" = "$VERSION_NUM" ] && [ "$VERSION_NUM" != "$LATEST_EXISTING" ]; then
                  echo "Version $VERSION is newer than existing v${LATEST_EXISTING} - will build"
                  echo "should_build=true" >> "$GITHUB_OUTPUT"
              else
                  echo "Version $VERSION is not newer than existing v${LATEST_EXISTING} - skipping build"
                  echo "should_build=false" >> "$GITHUB_OUTPUT"
              fi
          fi

      - name: Prepare tags
        id: tags
        if: steps.version_check.outputs.should_build == 'true'
        run: |
          VERSION="${{ steps.version_check.outputs.version }}"
          FULL="${{ steps.reg.outputs.registry }}/${{ steps.reg.outputs.image }}"
          TAGS="${FULL}:latest"
          TAGS="$TAGS"$'\n'"${FULL}:${VERSION}"

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Tags to build:"
          echo "$TAGS"

      - name: Build and push Docker image
        if: steps.version_check.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # GHA cache is GitHub-hosted; skip on Forgejo to avoid reserveCache timeouts.
          cache-from: ${{ steps.reg.outputs.host == 'github' && 'type=gha' || '' }}
          cache-to: ${{ steps.reg.outputs.host == 'github' && 'type=gha,mode=max' || '' }}
